name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PaymentSys.slnx

      - name: Build
        run: dotnet build PaymentSys.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PaymentSys.slnx --no-build --no-restore --configuration Release
